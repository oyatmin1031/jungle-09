openapi: 3.2.0

info:
  title: Jungle 09 API
  version: 1.0.0
  description: 공동구매 서비스 API

servers:
  - url: http://localhost:5000
    description: Local server

paths:
  /api/auth/login:
    post:
      summary: 로그인
      description: 로그인을 한다.

      requestBody:
        required: true
        content:
          application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공

          headers:
            Set-Cookie:
              description: HttpOnly Refresh Token 쿠키
              schema:
                type: string
                example: >-
                  refresh_token=eyJ...;
                  HttpOnly;
                  Secure;
                  SameSite=Lax;
                  Path=/api/auth/refresh

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        
        "401":
          description: 로그인 실패
          
  
  /api/auth/signup:
    post:
      summary: 회원가입
      description: 회원가입 요청

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 회원가입 성공
        "409":
          description: 이미 존재하는 ID


  /api/auth/refresh:
    post:
      summary: Access Token 재발급

      security:
        - cookieAuth: []
        #쿠키 인증

      responses:
        "200":
          description: 재발급 성공
          #성공했으면, 토큰 재발급 해줘야 함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

      

components:
  securitySchemes:
  #로그인 된 유저 구별할 때 쓰시면 될 것 같아용 아마도!!
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
    # 쿠키에 담긴 refresh_token을 인증 수단으로 사용
      type: apiKey
      in: cookie
      name: refresh_token 

  schemas:
    
    LoginRequest:
      type: object
      required:
        - username
        - password

      properties: 
        username:
          type: string
          example: username
        
        password:
          type: string
          example: password

    TokenData:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties: 
        accessToken:
          type: string
          description: API 인증에 사용할 accessToken
          example: eyJhbGciOiJIUzI1NiIs...
        
        tokenType:
          type: string
          example: Bearer

        expiresIn:
          type: integer
          description: accessToken 유효 시간(초)
          example: 1800
    
    TokenResponse:
      type: object
      required:
        - data

      properties: 
        data:
          $ref: "#/components/schemas/TokenData"
    
    #LoginResponse가 TokenResponse에 Success 여부만 추가되어있는 애라 그냥 뺐습니다 맘에안드시면 문의...
    # LoginResponse:
    #   type: object
    #   required:
    #     - success
    #     - data
      
    #   properties: 
    #     success:
    #       type: boolean
    #       const: true

    #     data:
    #       $ref: "#/components/schemas/TokenData"

    SignupRequest:
      type: object
      required:
        - username
        - nickname
        - password
      properties: 
        username:
          type: string
          description: 유저 아이디
        nickname:
          type: string
          description: 화면에 표시될 닉네임
        password:
          type: string