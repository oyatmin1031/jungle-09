<!-- 로그인 페이지 -->

<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/output.css')}}"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
        />

        <script
            src="https://code.jquery.com/jquery-3.5.1.min.js"
            integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
            crossorigin="anonymous"
        ></script>
        <title>정글09 로그인</title>
    </head>

    <body>
        <header class="my-4 w-5xl m-auto flex justify-between">
            <a href="/">
                <h2 class="text-2xl content-center">정글 09</h2>
            </a>
        </header>

        <main
            class="flex-grow bg-white rounded-box shadow-sm flex items-center justify-center p-4"
        >
            <div class="card bg-[#d9d9d9] w-full max-w-md shrink-0">
                <div class="card-body p-8 sm:p-10">
                    <!-- 타이틀 -->
                    <h2
                        class="card-title justify-center text-2xl font-bold mb-4 text-gray-900"
                    >
                        로그인
                    </h2>

                    <form id="login-form" class="flex flex-col gap-3">
                        <!-- 아이디 입력 -->
                        <div class="form-control">
                            <label class="label pb-1" for="username">
                                <span
                                    class="label-text font-semibold text-gray-800"
                                    >아이디</span
                                >
                            </label>
                            <input
                                type="text"
                                id="username"
                                class="input bg-[#f0f0f0] border-none w-full focus:outline-none focus:ring-2 focus:ring-gray-300"
                            />
                        </div>

                        <!-- 비밀번호 입력 -->
                        <div class="form-control">
                            <label class="label pb-1" for="password">
                                <span
                                    class="label-text font-semibold text-gray-800"
                                    >비밀번호</span
                                >
                            </label>
                            <input
                                type="password"
                                id="password"
                                class="input bg-[#f0f0f0] border-none w-full focus:outline-none focus:ring-2 focus:ring-gray-300"
                            />
                        </div>

                        <!-- 로그인 버튼 -->
                        <div class="form-control mt-4">
                            <button
                                type="submit"
                                class="btn w-full bg-[#f0f0f0] hover:bg-gray-300 border-none text-gray-800 text-base font-semibold"
                            >
                                로그인
                            </button>
                        </div>
                    </form>

                    <!-- 회원가입 링크 -->
                    <div class="flex justify-end mt-2">
                        <a
                            href="/register"
                            class="link link-hover text-blue-600 text-sm font-medium"
                            >회원가입</a
                        >
                    </div>
                </div>
            </div>
        </main>

        <script>
            $("#login-form").on("submit", function (event) {
                // 폼 제출 시 새로고침 방지
                event.preventDefault();

                // 입력값 가져오기
                const username = $("#username").val();
                const password = $("#password").val();

                // 값 비어있는지 확인
                if (!isValid(username, password)) return;

                // AJAX 통신 시작
                $.ajax({
                    type: "POST",
                    url: "/api/auth/login", // 백엔드 로그인 API 주소
                    contentType: "application/json",
                    data: JSON.stringify({
                        username: username,
                        password: password,
                    }),
                    success: function (response) {
                        // 로그인 성공 시 (상태 코드 200)
                        alert("로그인에 성공했습니다!");

                        // 발급받은 accessToken을 로컬 스토리지에 저장
                        localStorage.setItem(
                            "accessToken",
                            response.data.accessToken,
                        );

                        // 메인 페이지로 이동
                        window.location.href = "/";
                    },
                    error: function (xhr) {
                        // 로그인 실패 시 (401, 404 등)
                        // 백엔드에서 보내준 에러 메시지(msg)를 알림창으로 띄움
                        if (xhr.responseJSON && xhr.responseJSON.msg) {
                            alert(xhr.responseJSON.msg);
                        } else {
                            alert("서버와 통신 중 에러가 발생했습니다.");
                        }
                    },
                });
            });

            // 제목 내용 비어있는지 확인
            function isValid(username, password) {
                if (username === "" || password === "") {
                    alert("아이디와 비밀번호를 모두 입력해주세요.");
                    return false;
                }
                return true;
            }
        </script>
    </body>
</html>
