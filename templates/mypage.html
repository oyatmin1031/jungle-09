<!-- 마이페이지 -->

<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css')}}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <title>정글09 마이페이지</title>
</head>

<body>
    <header class="my-4 w-5xl m-auto flex justify-between">
        <h2 class="text-2xl content-center">정글 09</h2>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-10">
        <div class="card bg-base-100 shadow-sm">
            <!-- name of each tab group should be unique -->
            <div class="tabs tabs-box">
                <!-- 내가 참여한 공구 탭 -->
                <input type="radio" name="my_tabs_6" class="tab" aria-label="내가 참여한 공구" checked="checked" />
                <div class="tab-content bg-base-100 border-base-300 p-6">
                    <div class="overflow-x-auto">
                        <table class="table">
                            <!-- head -->
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>수량</th>
                                    <th>마감일</th>
                                    <th></th>
                                    <th>상태</th>
                                </tr>
                            </thead>
                            <tbody id="participated-list">
                                <!-- 참여한 공구 목록 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 내가 연 공구 탭 -->
                <input type="radio" name="my_tabs_6" class="tab" aria-label="내가 연 공구" />
                <div class="tab-content bg-base-100 border-base-300 p-6">
                    <div class="overflow-x-auto">
                        <table class="table">
                            <!-- head -->
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>마감일</th>
                                    <th>상태</th>
                                </tr>
                            </thead>
                            <tbody id="created-list">
                                <!-- 내가 연 공구 목록 -->
                            </tbody>
                        </table>
                    </div>
                </div>


            </div>
        </div>
    </main>

    <script>
        $(document).ready(function () {
            // 페이지가 로드되면 '내가 참여한 공구' 목록 불러옴
            loadParticipatedGonggu();
            // 페이지가 로드되면 '내가 연 공구' 목록 불러옴
            loadCreatedGonggu();
        });

        // 내가 참여한 공구 목록 불러오기
        function loadParticipatedGonggu() {
            const token = localStorage.getItem('accessToken');

            $.ajax({
                type: 'GET',
                url: '/api/gonggu/my_gonggu',
                // JWT 토큰을 헤더에 담아서 보냅니다 (로그인 유저 확인용)
                headers: {
                    "Authorization": "Bearer " + token
                },
                success: function (response) {
                    const list = response.my_gonggu_list;
                    const tbody = $('#participated-list');

                    // 표 비우기
                    tbody.empty();

                    // 데이터가 없을 경우 처리
                    if (list.length === 0) {
                        tbody.append('<tr><td colspan="5" class="text-center py-4">참여한 공구가 없습니다.</td></tr>');
                        return;
                    }

                    list.forEach(function (item) {
                        let statusText = item.status === 'recruiting' ? '공구 신청 중' :
                            item.status === 'closed' ? '공구 신청 마감' :
                                item.status === 'ordered' ? '주문 완료' :
                                    item.status === 'delivered' ? '배송 완료' :
                                        item.status === 'completed' ? '공구 완료' : item.status;

                        let tempHtml = `
                        <tr>
                            <td>
                                <div class="flex items-center gap-3">
                                    <div>
                                        <div class="font-bold">${item.title}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${item.quantity}</td>
                            <td>${item.deadline}</td>
                            <td>
                                <button onclick="window.open('${item.kakao_link}', '_blank')" class="btn btn-ghost btn-sm">채팅방</button>
                            </td>
                            <td>
                                <span class="badge badge-ghost badge-md">${statusText}</span>
                            </td>
                        </tr>
                    `;
                        tbody.append(tempHtml);
                    });
                },
                error: function (xhr) {
                    if (xhr.status === 401) {
                        alert('로그인이 필요한 서비스입니다.');
                        window.location.href = '/login';
                    } else {
                        alert('데이터를 불러오는 중 문제가 발생했습니다.');
                    }
                }
            });
        }

        // 내가 만든 공구 목록 불러오기
        function loadCreatedGonggu() {
            const token = localStorage.getItem('accessToken');

            $.ajax({
                type: 'GET',
                url: '/api/gonggu/my_created_gonggu',
                headers: {
                    "Authorization": "Bearer " + token
                },
                success: function (response) {
                    const list = response.my_created_gonggu_list;
                    const tbody = $('#created-list');

                    tbody.empty();

                    if (list.length === 0) {
                        tbody.append('<tr><td colspan="5" class="text-center py-4">개설한 공구가 없습니다.</td></tr>');
                        return;
                    }

                    list.forEach(function (item) {
                        let statusText = item.status === 'recruiting' ? '공구 신청 중' :
                            item.status === 'closed' ? '공구 신청 마감' :
                                item.status === 'ordered' ? '주문 완료' :
                                    item.status === 'delivered' ? '배송 완료' :
                                        item.status === 'completed' ? '공구 완료' : item.status;

                        let tempHtml = `
                        <tr>
                            <td>
                                <div class="flex items-center gap-3">
                                    <div>
                                        <div class="font-bold">${item.title}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${item.deadline}</td>
                            <td>
                                <div class="dropdown dropdown-right">
                                    <div tabindex="0" role="button" class="btn btn-sm m-1">${statusText}</div>
                                    <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-40 p-2 shadow-sm">
                                        <li><a onclick="changeStatus('${item._id}', 'recruiting')">공구 신청 중</a></li>
                                        <li><a onclick="changeStatus('${item._id}', 'closed')">공구 신청 마감</a></li>
                                        <li><a onclick="changeStatus('${item._id}', 'ordered')">주문 완료</a></li>
                                        <li><a onclick="changeStatus('${item._id}', 'shipping')">배송 완료</a></li>
                                        <li><a onclick="changeStatus('${item._id}', 'completed')">공구 완료</a></li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                    `;
                        tbody.append(tempHtml);
                    });
                },
                error: function (xhr) {
                    if (xhr.status === 401) {
                        alert('로그인이 필요한 서비스입니다.');
                        window.location.href = '/login';
                    } else {
                        alert('데이터를 불러오는 중 문제가 발생했습니다.');
                    }
                }
            });
        }

        // 공구 진행 상태 변경
        function changeStatus(gongguId, newStatus) {
            const token = localStorage.getItem('accessToken');

            $.ajax({
                type: 'PATCH', 
                url: `/api/gonggu/${gongguId}/status`,
                headers: {
                    "Authorization": "Bearer " + token
                },
                contentType: 'application/json',
                data: JSON.stringify({ "status": newStatus }),
                success: function (response) {
                    alert(response.message);
                    // 상태가 변경되었으니 새로고침 하거나, 목록 불러오는 함수를 다시 실행해서 화면 갱신
                    window.location.reload();
                    // 이건 창 전체 새로고침 아닌가? 비우고 다시 불러올까
                },
                error: function (xhr) {
                    alert('상태 변경에 실패했습니다.');
                }
            });
        }
    </script>
</body>
